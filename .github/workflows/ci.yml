name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complexity tool
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Verify
        env:
          GOCACHE: ${{ runner.temp }}/wingman-go-cache
        run: bash scripts/verify.sh

      - name: Namespace acceptance
        run: bash scripts/namespace-smoke.sh --scenario all
